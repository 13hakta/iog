[package]
name = "iog"
version = "1.0.0"
edition = "2021"
description = "I/O Gateway - асинхронный сетевой шлюз с бинарным протоколом"
authors = ["Vitaly Chekryzhev"]

[[bin]]
name = "iog"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
config = "0.13"
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
chrono = "0.4"
log = "0.4"
env_logger = "0.10"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
libc = "0.2"
tokio-rustls = "0.25"
rustls-pemfile = "2"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
once_cell = "1.19"
# tokio::signal уже включён в tokio features = ["full"]
# tracing = "0.1"
# tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
object-pool = "0.6"
zstd = "0.13"
uuid = { version = "1", features = ["v4", "serde"] }
prometheus = "0.13"
axum = "0.7"

[profile.release]
opt-level = 3
lto = true
