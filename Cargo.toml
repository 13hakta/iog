[package]
name = "iog"
version = "1.0.0"
edition = "2021"
description = "I/O Gateway - асинхронный сетевой шлюз с бинарным протоколом"
authors = ["Vitaly Chekryzhev"]

[[bin]]
name = "iog"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
config = "0.15"
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
hmac = "0.12"
sha2 = "0.10"
rand = "0.9"
zstd = "0.13"
zstd-safe = "7"
uuid = { version = "1", features = ["v4"] }
prometheus = "0.13"
axum = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
